<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stephen & Daniel — July 10, 2026</title>
  <meta name="description" content="Stephen & Daniel — Honolulu, HI — July 10, 2026. Full website will be live on November 1st!" />
  <meta property="og:title" content="Stephen & Daniel — July 10, 2026" />
  <meta property="og:description" content="Honolulu, HI — Full website will be live on November 1st!" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/img/og-cover.jpg" />
  <meta name="theme-color" content="#7a6a56">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/yoj5rjq.css">

  <!-- Local font: Safira March -->
  <style>
    @font-face {
      font-family: "Safira March";
      src: url("assets/fonts/SafiraMarch.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root{
      --font-body: "beloved-sans", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      --font-script-1: "beloved-script", cursive;
      --font-display: "Safira March", cursive;

      --color-accent: #C9A64C;
      --color-text-on-video: #fff;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-body);
      background: #000;             /* fallback behind video */
      color: var(--color-text-on-video);
    }

    /* Fullscreen hero with video background */
    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .hero-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.35));
      display: grid; place-items: center;
      padding: 24px;
    }

    .title-card {
      text-align: center;
      color: var(--color-text-on-video);
      backdrop-filter: blur(6px);
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 20px;
      padding: clamp(20px, 4vw, 36px);
    }

    h1 {
      margin: 0 0 0.1em 0;
      font-family: var(--font-display);   /* ✅ fixed variable */
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.35);
      font-size: clamp(48px, 8vw, 80px);
      line-height: 1.05;
    }

    .hero-subline {
      margin: 0.15em 0 0.6em 0;
      font-family: var(--font-script-1);
      font-weight: 700;
      color: var(--color-accent);
      letter-spacing: 0.3px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.35);
      font-size: clamp(20px, 3.5vw, 32px);
      line-height: 1.1;
    }

    .coming-soon {
      margin: 0;
      font-size: clamp(14px, 2.2vw, 18px);
      opacity: 0.95;
      font-style: italic;
      color: #fff;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-video { animation: none; }
    }
  </style>
  <link rel="preload" href="assets/video/oahu-web-8s-720p.v1.mp4" as="video" type="video/mp4" fetchpriority="high">
<link rel="preload" href="assets/video/oahu-web-8s-720p.v1.webm" as="video" type="video/webm" fetchpriority="high">

</head>
<body>
  <section class="hero" aria-label="Hero video">
    <video class="hero-video" autoplay muted playsinline loop preload="auto" poster="assets/img/hero.jpg">
      <source src="assets/video/oahu-web-8s-720p.v1.mp4" type="video/mp4" />
      <source src="assets/video/oahu-web-8s-720p.v1.webm" type="video/webm" />
      Your browser does not support the video tag.
    </video>



    <div class="overlay">
      <div class="title-card">
        <h1>Stephen &amp; Daniel</h1>
        <p class="hero-subline">Honolulu, HI — July 10, 2026</p>
        <p class="coming-soon">Full website coming soon!</p>
      </div>
    </div>
  </section>
</body>
</html>
